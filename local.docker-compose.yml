# Fully local / offline Presio — a single container, no Supabase, no .env.
#
# Addresses https://github.com/PotentialHedge/presio/issues/2: the root
# docker-compose.yml is the full self-hosted stack (Supabase + Traefik +
# MinIO + analytics/uptime), which is deployment-only baggage if all you want
# is to present PDFs on your own machine or LAN. In PRESIO_MODE=local the
# server swaps Supabase for a bundled SQLite database and filesystem storage
# (see server/local/), so there's nothing else to run.
#
# Login/sync-by-account is unavailable in this mode (there's no auth provider
# to back it) — everything runs anonymous, which is enough for local
# presenting, handoff links, and LAN sync between the controller and viewers.
#
# Nothing to clone — this file is all you need, and it pulls a prebuilt image:
#
#   curl -fsSLO https://raw.githubusercontent.com/PotentialHedge/presio/main/local.docker-compose.yml
#   docker compose -f local.docker-compose.yml up
#   open http://localhost:3001
#
# Working in a checkout instead? `docker compose -f local.docker-compose.yml
# build` builds from source rather than using the published image.
#
# Viewers on other devices join by scanning the QR code on the share screen.
# Presio works out this machine's address for them, but it can only do that when
# it can see the host's network — and by default this container has its own. Set
# PRESIO_PUBLIC_HOST so it knows what to point at:
#
#   PRESIO_PUBLIC_HOST=$(hostname -I | awk '{print $1}'):3001 \
#     docker compose -f local.docker-compose.yml up
#
# Alternatively add `network_mode: host` (Linux only — on Docker Desktop the
# "host" is a Linux VM, not your machine), and detection works with no config at
# all. Without either, the share screen asks for the address once and remembers
# it. Opening http://<this-machine's-LAN-IP>:3001 directly also works: PDF links
# are relative, so they resolve either way.

name: presio-local

services:
  presio:
    # Published by .github/workflows/publish-local-image.yml (linux/amd64 +
    # linux/arm64). Compose pulls this when it isn't already present locally and
    # falls back to `build:` below, so this file works with or without a
    # checkout.
    #
    # Pinned to a major line: you get bug fixes and new features on `docker
    # compose pull`, but never an unreviewed breaking change. Other channels —
    # `:1.2.3` to pin exactly, `:latest` for the newest release whatever its
    # major, `:main` for the unstable tip of the default branch.
    image: ghcr.io/potentialhedge/presio-local:1
    # Explicit so `up` pulls rather than silently building from source — with
    # both image: and build: set, Compose's default is version-dependent, and a
    # copy of this file downloaded on its own has no build context to fall back
    # on. `docker compose build` still builds regardless.
    pull_policy: missing
    build:
      context: .
      dockerfile: deploy/Dockerfile
      # Built without Supabase config so the client's login UI talks to
      # nothing real; PRESIO_MODE=local makes the server side fully anonymous
      # to match (see client/src/lib/supabaseClient.ts's placeholder fallback).
      args:
        VITE_SUPABASE_URL: ""
        VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ""
        VITE_SENTRY_DSN: ""
    container_name: presio-local
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      PRESIO_MODE: local
      LOCAL_DATA_DIR: /data
      # No reverse proxy in front of this container.
      TRUST_PROXY: "false"
      # The address other devices reach this machine on, e.g. 192.168.1.20:3001.
      # A container on the default bridge network can't discover it — every
      # address it can see belongs to the container — so share links fall back
      # to asking the presenter unless this is set. See the header above.
      PRESIO_PUBLIC_HOST: ${PRESIO_PUBLIC_HOST:-}
    volumes:
      - presio-local-data:/data

volumes:
  presio-local-data:
