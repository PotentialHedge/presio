name: Publish local image

# Builds the prebuilt offline-mode image published at
# ghcr.io/<owner>/presio-local, so self-hosters can run Presio locally without
# cloning or building anything (see deploy/README.md). The image is the ordinary
# app image built with no Supabase config baked into the client; PRESIO_MODE=local
# at runtime is what selects the SQLite/filesystem backend.

#
# Tag channels:
#   :latest          the newest *release* — what self-hosters should track
#   :1, :1.2, :1.2.3 pinned-but-patched channels from `v*` tags
#   :main            tip of main, unstable; no upgrade guarantees
#   :sha-<short>     immutable, for pinning an exact build
#
# `latest` deliberately does NOT follow main: companies self-host this image,
# and a floating tag that moves with every merge is not something anyone can
# run in production.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/potentialhedge/presio-local

jobs:
  # Publishing used to race CI off the same push, so an image could ship from a
  # commit whose tests had already failed. Now the suite is a prerequisite.
  tests:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing / provenance attestations
      attestations: write # persist the provenance attestation to GitHub's store
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=sha,prefix=sha-

      # Build the runner's native arch first and actually boot it. better-sqlite3
      # is a native module, so "the image built" says nothing about whether it
      # runs — a bad binary only shows up as a segfault at require() time.
      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: presio-local:smoke
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: deploy/smoke-test.sh presio-local:smoke ${{ env.IMAGE }}:latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Ship a signed build record and an SBOM with the image, so anyone
          # self-hosting it can verify it was built from this repo by this
          # workflow and see what is inside it before deploying.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # BuildKit's `provenance:` above attaches an attestation to the image in
      # the registry; this publishes a Sigstore-signed one to GitHub's own
      # attestation store as well. They are different mechanisms with different
      # verification paths, and only this one is discoverable with
      # `gh attestation verify` — which is the check most people reach for.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
