name: CI

# Pull requests only. Pushes to main are covered by promote-staging.yml and
# publish-local-image.yml, which each run the same suite as their own gate.
on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  # Only when the image could actually have changed. Building it on every PR
  # would add minutes to changes that cannot affect it; skipping it entirely
  # meant base image and native-dependency bumps were merged on the strength of
  # unit tests alone, and first built after landing on main.
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            image:
              - 'deploy/Dockerfile'
              - 'shared/**'
              - 'deploy/smoke-test.sh'
              - 'server/package*.json'
              - 'client/package*.json'
              - '.github/workflows/image.yml'
              - '.github/workflows/ci.yml'

  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    uses: ./.github/workflows/image.yml
