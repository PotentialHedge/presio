<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; background: transparent; }
  .stage { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vmin; background: #000; color: #fff; text-align: center; padding: 4vmin; box-sizing: border-box; }
  .heading { color: rgba(255, 255, 255, .6); font-size: 3vmin; }
  .code { font: 700 14vmin/1 ui-monospace, monospace; letter-spacing: .15em; }
  .url { color: rgba(255, 255, 255, .75); font-size: 3.2vmin; word-break: break-all; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="stage" id="stage" hidden>
  <div class="heading" id="heading"></div>
  <div class="code" id="code"></div>
  <div class="url" id="url"></div>
</div>

<script>
  // One file, two surfaces:
  //  - background (presenter's device): owns the "showing" state and the
  //    "toggle" command (the bottom-bar button, the C key), and broadcasts
  //    the state to viewers (retained, so a phone that joins while the code
  //    is up shows it too);
  //  - viewer (every viewer screen): draws the code while it's showing.
  const $ = (id) => document.getElementById(id);
  let showing = false;

  function renderButton() {
    const { local } = presio.session;
    presio.ui.setButton("toggle", {
      active: showing && !local,
      // A local deck has no join code to show.
      disabled: local,
      label: showing && !local ? "Hide join code" : "Join code",
    });
  }

  function renderStage() {
    const { id, joinUrl, local } = presio.session;
    $("heading").textContent = presio.settings.get("heading");
    $("code").textContent = id;
    $("url").textContent = joinUrl ? joinUrl.replace(/^https?:\/\//, "") : "";
    $("url").hidden = !presio.settings.get("showUrl");
    presio.ui.setVisible(showing && !local);
  }

  const render = presio.surface === "background" ? renderButton : renderStage;
  $("stage").hidden = presio.surface !== "viewer";

  if (presio.surface === "background") {
    const toggle = () => {
      // A local deck has no join code to show.
      if (presio.session.local) return;
      showing = !showing;
      presio.messages.send("visible", { on: showing }, { retain: true });
      render();
    };
    presio.commands.register("toggle", toggle);
  }

  presio.messages.onMessage(({ type, payload, from }) => {
    if (type === "visible" && from === "presenter") {
      showing = !!payload?.on;
      render();
    }
  });
  presio.onContextChange(render);
  presio.settings.onChange(render);
  render();
</script>
</body>
</html>
