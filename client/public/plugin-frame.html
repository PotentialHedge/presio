<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The page every plugin runs in: the runtime for plugin API version 1.
     Plugins are trusted code the presenter installed, so this frame is for a
     stable API and containment, not security: the server replaces the app's
     CSP with a permissive one here (PLUGIN_FRAME_CSP in server/security.ts). -->
<script>
// The host posts one "presio:boot" message carrying a MessagePort and the
// handshake (shared/plugin/protocol.ts): the protocol version, what the host
// can do, the starting context, and the plugin's HTML. This installs
// `window.presio` on top of that port and then replaces this document with
// the plugin's. document.open() keeps the global object (so `presio`
// survives) but drops window event listeners, which is why everything after
// boot talks over the port rather than window.onmessage.
//
// On the port, every message is an envelope:
//   { v: 1, kind: "call" | "result" | "error" | "event", id?, method, params | result | error }
// The plugin's calls go to the host ("deck.bytes", "ui.setButton"); the host
// sends events for what changes ("slide.change") and calls the plugin for
// what only it can answer ("commands.run", "deck.export").
(function () {
  var PROTOCOL = 1;
  var API_VERSION = 1;

  window.addEventListener("message", function onBoot(e) {
    if (e.source !== window.parent) return;
    var d = e.data;
    if (!d || d.type !== "presio:boot" || !e.ports || !e.ports[0]) return;
    window.removeEventListener("message", onBoot);
    if (d.protocol !== PROTOCOL) {
      console.error("Presio: this frame speaks plugin protocol " + PROTOCOL + ", the host " + d.protocol);
      return;
    }
    boot(e.ports[0], d);
  });

  function boot(port, d) {
    var ctx = d.context;
    var capabilities = (d.capabilities || []).slice();
    var slideListeners = [];
    var messageListeners = [];
    var contextListeners = [];
    var settingsListeners = [];
    var storageListeners = [];
    var deckListeners = [];
    var viewListeners = [];
    var pageListeners = [];
    var hoverListeners = [];
    // Command id -> its handler in this frame.
    var commands = {};
    var exporter = null;
    // presio.history, once opened: this frame's copy of the plugin's state.
    var history = null;
    // Messages that arrive before the plugin subscribes (retained state is
    // replayed right after boot) wait here instead of being dropped.
    var pending = [];
    var calls = {};
    var nextCall = 1;

    function send(m) {
      m.v = PROTOCOL;
      port.postMessage(m);
    }
    function withBase(html, baseUrl) {
      if (!baseUrl || /<base[\s>]/i.test(html)) return html;
      var tag = '<base href="' + baseUrl.replace(/"/g, "&quot;") + '">';
      var head = /<head[^>]*>/i.exec(html);
      return head ? html.replace(head[0], head[0] + tag) : tag + html;
    }
    /** Call a host method; resolves to its result, or rejects with an Error
     *  whose `code` is one of the protocol's (MethodNotFound, PermissionDenied,
     *  InvalidParams, Unavailable, Internal). */
    function call(method, params) {
      var id = nextCall++;
      return new Promise(function (resolve, reject) {
        calls[id] = { resolve: resolve, reject: reject };
        send({ kind: "call", id: id, method: method, params: params || {} });
      });
    }
    /** A call nobody waits on: a failure is logged, not thrown. */
    function fire(method, params) {
      call(method, params).catch(function (err) { console.error("presio: " + method + ": " + err.message); });
    }
    // Call each listener with the arguments after `list`; one that throws
    // doesn't stop the rest.
    function each(list) {
      var args = Array.prototype.slice.call(arguments, 1);
      list.slice().forEach(function (cb) {
        try { cb.apply(null, args); } catch (err) { console.error(err); }
      });
    }
    function subscribe(list, cb) {
      list.push(cb);
      return function () {
        var i = list.indexOf(cb);
        if (i >= 0) list.splice(i, 1);
      };
    }
    function failure(code, message) {
      var err = new Error(message);
      err.code = code;
      return err;
    }

    // --- What the host sends ---

    var events = {
      "context.change": function (p) {
        ctx = p.context;
        each(contextListeners, api);
      },
      "slide.change": function (p) {
        ctx.slide = p.slide;
        each(slideListeners, ctx.slide);
      },
      "settings.change": function (p) {
        ctx.settings = p.settings;
        each(settingsListeners, Object.assign({}, ctx.settings));
      },
      "storage.change": function (p) {
        ctx.storage = p.storage;
        each(storageListeners, Object.assign({}, ctx.storage));
      },
      "commands.shortcuts": function (p) {
        ctx.shortcuts = p.shortcuts;
        each(contextListeners, api);
      },
      "clock.offset": function (p) { ctx.clockOffset = p.offset; },
      "deck.change": function (p) { each(deckListeners, p.kind || "replace"); },
      "ui.view": function (p) {
        ctx.view = p.view;
        each(viewListeners, ctx.view);
      },
      "ui.page": function (p) {
        ctx.page = p.page;
        each(pageListeners, ctx.page);
      },
      "ui.hover": function (p) {
        ctx.hovered = p.hovered;
        each(hoverListeners, ctx.hovered);
      },
      "messages.receive": function (p) {
        if (messageListeners.length) each(messageListeners, p);
        else pending.push(p);
      },
      "history.update": function (p) { if (history) history.receive(p); },
    };

    // Methods the host calls here. Each returns the result (or a promise of it).
    var handlers = {
      "commands.run": function (p) {
        var handler = commands[p.command];
        if (!handler) throw failure("Unavailable", 'No handler for "' + p.command + '" (presio.commands.register)');
        return handler(p.args);
      },
      // The presenter is downloading the deck: pass it through this
      // plugin's export handler, if it has one.
      "deck.export": function (p) {
        var handler = exporter;
        return Promise.resolve(handler ? handler(p.bytes, { mode: p.mode }) : p.bytes).then(function (bytes) {
          if (!(bytes instanceof Uint8Array)) throw failure("Internal", "onExport handlers resolve to a Uint8Array");
          return bytes;
        });
      },
      "history.snapshot": function () {
        if (!history) throw failure("Unavailable", "presio.history isn't open here");
        return history.snapshot();
      },
    };

    function answer(m) {
      var handler = Object.prototype.hasOwnProperty.call(handlers, m.method) ? handlers[m.method] : null;
      Promise.resolve()
        .then(function () {
          if (!handler) throw failure("MethodNotFound", 'Unknown method "' + m.method + '"');
          return handler(m.params || {});
        })
        .then(
          function (result) {
            try {
              send({ kind: "result", id: m.id, method: m.method, result: result === undefined ? null : result });
            } catch (err) {
              // Not structured-cloneable (a function, a DOM node).
              send({ kind: "error", id: m.id, method: m.method, error: { code: "Internal", message: "The result can't be sent: " + err.message } });
            }
          },
          function (err) {
            if (!err || !err.code) console.error(err);
            send({
              kind: "error",
              id: m.id,
              method: m.method,
              error: { code: (err && err.code) || "Internal", message: String((err && err.message) || err) },
            });
          }
        );
    }

    port.onmessage = function (e) {
      var m = e.data;
      if (!m || m.v !== PROTOCOL) return;
      if (m.kind === "event") {
        var on = events[m.method];
        if (on) on(m.params || {});
      } else if (m.kind === "call") {
        answer(m);
      } else if (m.kind === "result" || m.kind === "error") {
        var c = calls[m.id];
        delete calls[m.id];
        if (!c) return;
        if (m.kind === "result") c.resolve(m.result);
        else c.reject(failure(m.error && m.error.code, (m.error && m.error.message) || "failed"));
      }
    };

    // presio.history: the plugin's ordered edits, the same on every device.
    // State is init() (or the snapshot the log starts from, restored), then
    // every ordered entry applied in turn — "confirmed" — and, on top, this
    // device's ops still waiting for their place — "pending" — so a commit
    // shows at once.
    function openHistory(spec) {
      if (!spec || typeof spec.init !== "function" || typeof spec.apply !== "function") {
        throw new Error("presio.history.open() needs init() and apply(state, op, entry)");
      }
      var confirmed = spec.init();
      var confirmedSeq = 0;
      var entries = [];
      var pendingOps = [];
      // Committed here but not yet in anything the host sent back: kept on
      // top until it is, so the op never blinks out.
      var local = [];
      var device = null;
      var ready = false;
      var view = confirmed;
      var changeListeners = [];
      var errorListeners = [];
      var readyWaiters = [];
      var counter = 0;

      function ops() {
        var ids = {};
        pendingOps.forEach(function (p) { ids[p.id] = true; });
        return pendingOps.concat(local.filter(function (p) { return !ids[p.id]; }));
      }
      function recompute(change) {
        view = ops().reduce(function (s, p) {
          return spec.apply(s, p.op, { id: p.id, by: p.by, pending: true });
        }, confirmed);
        each(changeListeners, view, change);
      }
      function settle(ids) {
        local = local.filter(function (p) { return !ids[p.id]; });
      }
      function applyEntry(e) {
        confirmed = spec.apply(confirmed, e.op, { id: e.id, by: e.by, at: e.at, seq: e.seq, pending: false });
        confirmedSeq = e.seq;
        entries.push(e);
      }
      function refused(id, message) {
        local = local.filter(function (p) { return p.id !== id; });
        each(errorListeners, id, message);
        recompute({ kind: "pending" });
      }

      var h = {
        /** The state: ordered entries, then this device's pending ops. */
        get state() { return view; },
        /** Only the ordered entries' state (what every device agrees on). */
        get confirmed() { return confirmed; },
        /** false until the history has loaded (state is init() until then). */
        get ready() { return ready; },
        whenReady: function () {
          return ready ? Promise.resolve(h) : new Promise(function (resolve) { readyWaiters.push(resolve); });
        },
        /** This browser's id: entries' `by`. */
        get device() { return device; },
        /**
         * Presenter: add an op. Shown here at once (pending), then ordered —
         * by the server for a shared deck — and applied on every device.
         * JSON, at most 16 KB. Returns its id.
         */
        commit: function (op) {
          var id = device ? device.slice(0, 8) : "op";
          id += "-" + Date.now().toString(36) + "-" + (counter++).toString(36) + Math.random().toString(36).slice(2, 6);
          local.push({ id: id, by: device, op: op });
          call("history.commit", { id: id, op: op }).catch(function (err) { refused(id, err.message); });
          recompute({ kind: "pending" });
          return id;
        },
        /**
         * This device's ops, newest first — ordered ones and pending ones —
         * for undo: [{ id, op, seq (null while pending) }].
         */
        mine: function () {
          var out = [];
          entries.forEach(function (e) { if (e.by === device) out.push({ id: e.id, op: e.op, seq: e.seq }); });
          ops().forEach(function (p) { out.push({ id: p.id, op: p.op, seq: null }); });
          return out.reverse();
        },
        /** cb(state, { kind: "state" | "entry" | "pending", entry? }) */
        onChange: function (cb) { return subscribe(changeListeners, cb); },
        /** cb(id, message): an op was refused (it's dropped from pending). */
        onError: function (cb) { return subscribe(errorListeners, cb); },
      };
      // What the host tells this frame about the history.
      function receive(m) {
        if (m.kind === "state") {
          device = m.device;
          confirmed = spec.init();
          if (m.base.snapshot && m.snapshot !== null) confirmed = spec.restore ? spec.restore(m.snapshot) : m.snapshot;
          confirmedSeq = m.base.seq;
          entries = [];
          m.entries.forEach(applyEntry);
          pendingOps = m.pending;
          var ids = {};
          pendingOps.forEach(function (p) { ids[p.id] = true; });
          m.entries.forEach(function (e) { ids[e.id] = true; });
          settle(ids);
          var wasReady = ready;
          ready = true;
          recompute({ kind: "state" });
          if (!wasReady) {
            var waiters = readyWaiters;
            readyWaiters = [];
            waiters.forEach(function (resolve) { resolve(h); });
          }
        } else if (m.kind === "entry") {
          if (m.entry.seq !== confirmedSeq + 1) return;
          applyEntry(m.entry);
          pendingOps = m.pending;
          var done = {};
          done[m.entry.id] = true;
          pendingOps.forEach(function (p) { done[p.id] = true; });
          settle(done);
          recompute({ kind: "entry", entry: m.entry });
        } else if (m.kind === "pending") {
          pendingOps = m.pending;
          var seen = {};
          pendingOps.forEach(function (p) { seen[p.id] = true; });
          settle(seen);
          recompute({ kind: "pending" });
        } else if (m.kind === "error") {
          refused(m.id, m.error);
        }
      }
      function snapshot() {
        var data = spec.snapshot ? spec.snapshot(confirmed) : null;
        return { seq: confirmedSeq, data: data === undefined ? null : data };
      }
      history = { handle: h, receive: receive, snapshot: snapshot };
      fire("history.open", { snapshots: typeof spec.snapshot === "function" });
      return h;
    }

    // Stand-ins for what's designed but not served by this host: calls reject
    // with Unavailable; presio.supports() says which is which.
    function notYet(method) {
      return function (a, b) { return call(method, { key: a, value: b }); };
    }

    var api = {
      /** The plugin API's major version this runtime implements. */
      apiVersion: API_VERSION,
      /** What the host can do: presio.supports("audience"). */
      get capabilities() { return capabilities.slice(); },
      supports: function (capability) { return capabilities.indexOf(capability) >= 0; },
      /** { id, name, displayName, version, baseUrl } — the id comes from where
       *  the plugin was loaded from ("alice/poll"); baseUrl is its own folder. */
      get plugin() { return ctx.plugin; },
      /** "background" (hidden, presenter's device), "panel" (a dashboard
       *  card — presio.panel says which), "viewer" (full screen on every
       *  viewer), "viewerSheet" (on audience devices) or "slide" (over the
       *  slide itself, on the presenter's current slide and every viewer). */
      get surface() { return ctx.surface; },
      /** Panel surface: the id of the panel (contributes.panels) this frame draws. */
      get panel() { return ctx.panel; },
      /** "presenter" or "audience": who is holding this device. */
      get role() { return ctx.role; },
      /** "light" or "dark": the app theme, for surfaces drawn inside its chrome. */
      get theme() { return ctx.theme; },
      /** { id, local, joinUrl } — joinUrl is null when the deck isn't shared. */
      get session() { return ctx.session; },
      /** Called with the whole API whenever session or role info changes, or
       *  the presenter's shortcuts do. */
      onContextChange: function (cb) { return subscribe(contextListeners, cb); },
      slide: {
        get current() { return ctx.slide.current; },
        get total() { return ctx.slide.total; },
        onChange: function (cb) { return subscribe(slideListeners, cb); },
      },
      messages: {
        /**
         * Message this plugin's other instances. From the presenter it
         * reaches every device; from the audience, only the presenter.
         * `retain: true` (presenter only) keeps the latest message of this
         * type for devices that join later, and across a reload of the
         * presenter's page — use it for state, not events; a retained null
         * payload forgets the type. `retain: "deck"` is the same, but only
         * for the deck on screen. `volatile: true` may be dropped rather than
         * queued when the connection is busy — for a stream where only the
         * latest value matters.
         */
        send: function (type, payload, opts) {
          fire("messages.send", {
            type: type,
            payload: payload === undefined ? null : payload,
            retain: opts && opts.retain === "deck" ? "deck" : !!(opts && opts.retain),
            volatile: !!(opts && opts.volatile),
          });
        },
        /** cb({ type, payload, from: "presenter" | "audience", sender? }) */
        onMessage: function (cb) {
          var off = subscribe(messageListeners, cb);
          var queued = pending;
          pending = [];
          queued.forEach(function (m) { each([cb], m); });
          return off;
        },
      },
      /** The plugin's settings (contributes.settings), as the presenter set
       *  them — viewers see the presenter's values. */
      settings: {
        get: function (name) { return ctx.settings[name]; },
        get all() { return Object.assign({}, ctx.settings); },
        /** Presenter: change one of this plugin's settings. Resolves once stored. */
        set: function (name, value) { return call("settings.set", { name: name, value: value }); },
        onChange: function (cb) { return subscribe(settingsListeners, cb); },
      },
      /**
       * Presenter only: small JSON values kept on this device for this
       * session. They survive a reload and are shared with this plugin's
       * other surfaces here; they never leave the device. `set(key)` with no
       * value removes one.
       */
      storage: {
        get: function (key) { return ctx.storage[key]; },
        get all() { return Object.assign({}, ctx.storage); },
        set: function (key, value) {
          if (value === undefined) delete ctx.storage[key];
          else ctx.storage[key] = value;
          fire("storage.set", { key: key, value: value });
        },
        /** Another surface of this plugin changed a value. */
        onChange: function (cb) { return subscribe(storageListeners, cb); },
      },
      /**
       * What the plugin can do, by id. Its buttons and keybindings run its
       * commands (contributes.commands), and so can other plugins. The
       * handler gets the call's args — { file } from a button with "accept",
       * { menuItem } from its menu — and what it returns is the result.
       */
      commands: {
        register: function (id, handler) {
          if (typeof handler !== "function") throw new Error("presio.commands.register(id, handler) needs a function");
          commands[id] = handler;
          fire("commands.register", { command: id });
          return function () {
            if (commands[id] !== handler) return;
            delete commands[id];
            fire("commands.unregister", { command: id });
          };
        },
        /** Run a command on this device: "<plugin id>.<command>", or a bare
         *  id for this plugin's own. Resolves to the handler's result. */
        execute: function (command, args) {
          return call("commands.execute", { command: command, args: args === undefined ? null : args });
        },
        /** The key the presenter has for one of this plugin's commands
         *  ("E", "⌘Z"), or null when it has none. */
        shortcut: function (id) { return (ctx.shortcuts && ctx.shortcuts[id]) || null; },
      },
      deck: {
        /** [{ filename, bytes: Uint8Array }] — needs the "deck" permission. */
        attachments: function () { return call("deck.attachments"); },
        /** The PDF itself, as a Uint8Array — needs the "deck" permission. */
        bytes: function () { return call("deck.bytes"); },
        /** Each page's size in PDF points, [{ width, height }] in page order — needs "deck". */
        pages: function () { return call("deck.pages"); },
        /** Presenter: replace the deck with an edited PDF (same pages) — needs "editDeck". */
        save: function (bytes) { return call("deck.save", { bytes: bytes }); },
        /** The deck was swapped. cb(kind): "edit" when the same pages were
         *  edited in place, "replace" when it's a different document. */
        onChange: function (cb) { return subscribe(deckListeners, cb); },
        /**
         * Transform the PDF this device downloads. handler(bytes, { mode })
         * resolves to the new bytes; one handler per plugin per device — the
         * background surface (or a panel) is used first. Returns a function
         * that removes it.
         */
        onExport: function (handler) {
          exporter = handler;
          fire("deck.setExporter", { on: true });
          return function () {
            if (exporter !== handler) return;
            exporter = null;
            fire("deck.setExporter", { on: false });
          };
        },
      },
      /**
       * Static layers: positioned images this plugin puts on slides, drawn by
       * Presio in every view of them (thumbnails, the next-slide preview).
       * Positions are fractions of the page. Per device.
       */
      layers: {
        /** items: [{ x, y, w, h, image, fit? ("cover" | "contain") }] */
        set: function (slide, items) { fire("layers.set", { slide: slide, items: items || [] }); },
        clear: function () { fire("layers.clear"); },
      },
      /**
       * The plugin's edit history for this deck — needs the "history"
       * permission. open({ init, apply, snapshot?, restore? }), once per
       * frame: apply(state, op, entry) returns the next state without
       * changing the one it's given.
       */
      history: {
        open: function (spec) { return history ? history.handle : openHistory(spec); },
      },
      /** Content-addressed bytes — needs "history". put() resolves to the
       *  hash; get(hash) to a Blob (or null). */
      blobs: {
        put: function (data) { return call("blobs.put", { data: data }); },
        get: function (sha) { return call("blobs.get", { sha: sha }); },
      },
      /** The server's clock, shared by every device in the session (ms). */
      clock: {
        now: function () { return Date.now() + (ctx.clockOffset || 0); },
      },
      /** Each viewer's input ("audience" permission). Not served yet:
       *  check presio.supports("audience"). */
      audience: {
        set: notYet("audience.set"),
        open: notYet("audience.open"),
        close: notYet("audience.close"),
        clear: notYet("audience.clear"),
        summary: notYet("audience.summary"),
        onChange: function () { return function () {}; },
      },
      ui: {
        /**
         * "slide" surface: whether it takes pointer input. false (the
         * default) lets everything through to the slide; true takes all of
         * it; a list of { x, y, w, h } fractions of the surface takes only
         * those areas; "pen" takes a pen's and a mouse's, and leaves fingers
         * to Presio (this frame still sees them).
         */
        setInteractive: function (value) { fire("ui.setInteractive", { value: value }); },
        /** "slide" surface: the part of it on screen, as fractions of it,
         *  and the zoom it's shown at. { x, y, w, h, scale }. */
        get view() { return ctx.view; },
        onViewChange: function (cb) { return subscribe(viewListeners, cb); },
        /** "slide" surface: where the page is within it, { x, y, w, h }. */
        get page() { return ctx.page || { x: 0, y: 0, w: 1, h: 1 }; },
        onPageChange: function (cb) { return subscribe(pageListeners, cb); },
        /** "slide" surface: whether a mouse is over the slide. */
        get hovered() { return !!ctx.hovered; },
        onHover: function (cb) { return subscribe(hoverListeners, cb); },
        /** Viewer surface: show or hide this plugin's full-screen layer. */
        setVisible: function (visible) { fire("ui.setVisible", { visible: !!visible }); },
        /** Update the buttons that run a command — { active, label,
         *  disabled, menu }. Each call replaces the last. `menu` adds a
         *  small menu beside it: a list of { id, label, checked?, disabled? },
         *  { heading } and { separator: true }; a pick runs the command with
         *  { menuItem: id }. */
        setButton: function (command, state) { fire("ui.setButton", { command: command, state: state || {} }); },
      },
    };
    Object.defineProperty(window, "presio", { value: api });

    document.open();
    // Relative URLs in the plugin (its scripts, styles, images) are its own:
    // resolve them against its folder, not against this page.
    document.write(withBase(d.html, ctx.plugin.baseUrl));
    document.close();
    // Keys pressed while this frame has focus (after a click on one of its
    // buttons) are the page's shortcuts all the same: replay the ones the
    // plugin didn't handle, and that weren't typed into a field, on the page
    // (same origin), and if the page acts on one — Space for the next slide —
    // keep it from also pressing the focused button here. Added after the
    // plugin's own listeners, so it can preventDefault() first.
    window.addEventListener("keydown", function (e) {
      var t = e.target;
      if (e.defaultPrevented || e.isComposing) return;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
      try {
        var page = window.parent;
        var replay = new page.KeyboardEvent("keydown", {
          key: e.key, code: e.code, metaKey: e.metaKey, ctrlKey: e.ctrlKey, altKey: e.altKey,
          shiftKey: e.shiftKey, repeat: e.repeat, bubbles: true, cancelable: true,
        });
        page.dispatchEvent(replay);
        if (replay.defaultPrevented) e.preventDefault();
      } catch (err) { /* not embedded by Presio's page */ }
    });
    send({ kind: "event", method: "frame.ready", params: {} });
  }
})();
</script>
</head>
<body></body>
</html>
